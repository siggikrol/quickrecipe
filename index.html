<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4efe6" />
<link rel="manifest" href="manifest.webmanifest" />
<title>QuickRecipe</title>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#211f1a;--muted:#746f65;--line:#ddd4c7;--accent:#b65632;--soft:#f3dfd5;--danger:#9e3535;--shadow:0 14px 36px rgba(46,39,31,.08)}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1160px;margin:auto;padding:24px 18px 64px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-family:Georgia,serif;font-size:34px;font-weight:700;letter-spacing:-1px}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:800}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 13px}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.ghost-danger{color:var(--danger)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:20px 0 12px}.search{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;outline:none}.units{display:flex;background:#e8e0d5;border-radius:12px;padding:3px}.units button{border:0;background:transparent;padding:9px 12px;border-radius:9px;color:var(--muted)}.units .active{background:var(--card);color:var(--ink);font-weight:700}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 16px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 11px}.chip.active{background:var(--ink);border-color:var(--ink);color:white}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.list{display:grid;gap:10px;align-content:start}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px;box-shadow:var(--shadow);text-align:left;width:100%}.card.active{outline:2px solid var(--accent)}.card-top{display:flex;justify-content:space-between;gap:10px}.card h3{font-size:19px;margin:5px 0 6px}.desc{color:var(--muted);font-size:13px}.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.stat{font-size:11px;background:#f0e9df;border-radius:999px;padding:6px 8px}.heart{font-size:20px;line-height:1;color:#b5aaa0}.heart.on{color:#ba4b44}.detail{border:1px solid var(--line);background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;min-height:500px}.detail-head{padding:22px;border-bottom:1px solid var(--line)}.detail-title-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.detail h1{font-family:Georgia,serif;font-size:38px;line-height:1.05;margin:5px 0 7px}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}.seg button{border:0;background:transparent;padding:8px 10px;color:var(--muted)}.seg button.active{background:var(--soft);color:var(--accent);font-weight:700}.detail-body{display:grid;grid-template-columns:1fr 1.1fr}.pane{padding:22px}.pane+.pane{border-left:1px solid var(--line)}.pane h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin:0 0 12px}.ingredient-section{margin:18px 0 2px;padding:9px 10px 8px;border-radius:10px;background:#f3eee5;color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.ingredient-section:first-of-type{margin-top:4px}.ingredient{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid #eee7dd}.ingredient:last-child{border-bottom:0}.amount{font-weight:750;white-space:nowrap}.steps{margin:0;padding-left:22px}.steps li{padding-left:5px;margin-bottom:12px}.meta{display:flex;gap:7px;flex-wrap:wrap;padding:15px 22px 20px;border-top:1px solid var(--line)}.hydration-box{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#faf6ef}.hydration-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hydration-row strong{min-width:108px}.hydration-row input[type=range]{flex:1;min-width:150px}.hydration-value{font-weight:800;min-width:48px;text-align:center}.mini-btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 9px}.hydration-help{font-size:11px;color:var(--muted);margin-top:6px}.empty{border:1px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(24,21,18,.5);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:10}.modal-backdrop.show{display:flex}.modal{background:var(--card);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.modal h2{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:white;border-radius:10px;padding:10px}.field textarea{min-height:90px;resize:vertical}.help{font-size:12px;color:var(--muted)}.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.right-actions{display:flex;gap:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:white;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:840px){.layout{grid-template-columns:1fr}.list{grid-template-columns:repeat(2,1fr)}.detail{grid-row:1}.detail-body{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:560px){.app{padding:18px 12px 50px}.brand{font-size:28px}.top{align-items:flex-start}.top-actions .btn span{display:none}.toolbar{grid-template-columns:1fr}.list{grid-template-columns:1fr}.detail-title-row{display:block}.detail-actions{justify-content:flex-start;margin-top:14px}.detail h1{font-size:34px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:16px}.modal-backdrop{padding:0;align-items:flex-end}.modal{border-radius:22px 22px 0 0;max-height:94vh}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="tag">Recipe-first cooking</div><div class="brand">QuickRecipe</div></div>
    <div class="top-actions"><button class="btn" id="favFilter">♡ <span>Favourites</span></button><button class="btn primary" id="addBtn">＋ <span>Add recipe</span></button></div>
  </header>
  <section class="toolbar"><input id="search" class="search" placeholder="Search recipes or ingredients…"><div class="units"><button id="metricBtn">Metric</button><button id="imperialBtn">Imperial</button></div></section>
  <div id="chips" class="chips"></div>
  <main class="layout"><section id="list" class="list"></section><section id="detail" class="detail"></section></main>
</div>

<div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="modalTitle">Add recipe</h2>
    <div class="form-grid">
      <div class="field"><label>Name</label><input id="fTitle"></div>
      <div class="field"><label>Category</label><input id="fCategory" placeholder="Bread"></div>
      <div class="field full"><label>Short description</label><input id="fDesc"></div>
      <div class="field"><label>Yield</label><input id="fYield" placeholder="2 loaves"></div>
      <div class="field"><label>Oven °C</label><input id="fTemp" type="number" placeholder="230"></div>
      <div class="field"><label>Prep</label><input id="fPrep" placeholder="15 min"></div>
      <div class="field"><label>Ferment / rest</label><input id="fFerment" placeholder="3 hr"></div>
      <div class="field"><label>Bake</label><input id="fBake" placeholder="25 min"></div>
      <div class="field"><label>Hydration %</label><input id="fHydration" type="number" step="0.1" placeholder="72"></div>
      <div class="field full"><label>Ingredients — one per line</label><textarea id="fIngredients" placeholder="Bread flour | 500 | g | flour\nWater | 360 | ml | water\nSalt | 10 | g | salt"></textarea><div class="help">Format: name | amount | unit | role. Role is optional; use “flour” to enable baker’s %.</div></div>
      <div class="field full"><label>Method — one step per line</label><textarea id="fSteps" placeholder="Mix ingredients.\nBulk ferment 2 hours.\nShape and proof.\nBake."></textarea></div>
    </div>
    <div class="modal-actions"><button class="btn ghost-danger" id="deleteBtn">Delete</button><div class="right-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save recipe</button></div></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const seedRecipes=[
{id:'white',category:'Bread',title:'Classic White Bread',hydration:65,hydrationMin:60,hydrationMax:72,adjustableHydration:true,desc:'Simple everyday loaf with a soft crumb and crisp top.',yield:'1 loaf',prep:'15 min',ferment:'2½–3 hr',bake:'30–35 min',tempC:220,ingredients:[['Bread flour',500,'g','flour'],['Water',325,'ml','water'],['Instant yeast',6,'g','yeast'],['Salt',10,'g','salt'],['Butter',20,'g','fat']],steps:['Mix flour, water and yeast. Rest 15 min.','Add salt and butter. Knead until smooth and elastic.','Bulk ferment 60–90 min, until doubled.','Shape, place in loaf tin, proof 45–60 min.','Bake until deep golden and fully set.']},
{id:'ciabatta',category:'Bread',title:'Ciabatta',hydration:72,hydrationMin:68,hydrationMax:80,adjustableHydration:true,desc:'Overnight ciabatta with open crumb and crisp crust.',yield:'2 large or 4 small',prep:'20 min',ferment:'14–20 hr',bake:'22–28 min',tempC:250,ingredients:[['Bread flour',500,'g','flour'],['Water',360,'ml','water'],['Instant yeast',2,'g','yeast'],['Salt',10,'g','salt'],['Olive oil',10,'ml','fat'],['Flour or semolina for dusting',20,'g','other']],steps:['Mix flour, yeast and most of the water. Rest 20–30 min.','Mix in salt with remaining water; add oil if using.','Do 3–4 stretch-and-folds, 30 min apart.','Cover and refrigerate 12–18 hr.','Warm 60–90 min, tip onto a floured surface and divide gently.','Proof 30–45 min. Bake 10 min with steam at 250°C, then 12–18 min at 220°C.']},
{id:'focaccia',category:'Bread',title:'Focaccia',hydration:75,hydrationMin:68,hydrationMax:85,adjustableHydration:true,desc:'Airy interior, olive-oil crust, easy tray bake.',yield:'1 tray',prep:'15 min',ferment:'3–4 hr',bake:'22–28 min',tempC:230,ingredients:[['Bread flour',500,'g','flour'],['Water',375,'ml','water'],['Instant yeast',4,'g','yeast'],['Salt',10,'g','salt'],['Olive oil',35,'ml','fat']],steps:['Mix flour, water and yeast. Rest 20 min.','Add salt and half the oil. Fold until cohesive.','Bulk ferment 2 hr with 2–3 folds.','Transfer to oiled tray. Proof 60–90 min.','Dimple, add remaining oil and salt. Bake until deeply golden.']},
{id:'baguette',category:'Bread',title:'French Baguette',hydration:70,hydrationMin:65,hydrationMax:78,adjustableHydration:true,desc:'Lean dough, crisp shell, creamy open crumb.',yield:'3 baguettes',prep:'20 min',ferment:'4–12 hr',bake:'20–24 min',tempC:250,ingredients:[['Bread flour',500,'g','flour'],['Water',350,'ml','water'],['Instant yeast',2,'g','yeast'],['Salt',10,'g','salt']],steps:['Mix flour, water and yeast. Rest 20 min.','Add salt and knead briefly.','Bulk ferment 2–3 hr, or refrigerate overnight after 60 min.','Divide, pre-shape, rest 20 min, then shape baguettes.','Proof 40–50 min, score, and bake with steam.']},
{id:'sandwich',category:'Bread',title:'Soft Sandwich Bread',hydration:63,hydrationMin:58,hydrationMax:68,adjustableHydration:true,desc:'Tender enriched loaf for toast and sandwiches.',yield:'1 large loaf',prep:'20 min',ferment:'2½–3 hr',bake:'30–35 min',tempC:200,ingredients:[['Bread flour',500,'g','flour'],['Milk',315,'ml','water'],['Instant yeast',6,'g','yeast'],['Salt',9,'g','salt'],['Sugar',30,'g','sugar'],['Butter',40,'g','fat']],steps:['Mix flour, milk and yeast. Rest 10 min.','Add salt, sugar and butter. Knead until smooth.','Bulk ferment 60–90 min.','Shape tightly and proof in loaf tin 45–60 min.','Bake until golden; cool before slicing.']},
{id:'overnight',category:'Bread',title:'Rustic Overnight Bread',hydration:72,hydrationMin:68,hydrationMax:80,adjustableHydration:true,desc:'Mix at night, bake the next day. Crisp crust and open crumb.',yield:'1 large loaf',prep:'10 min',ferment:'12–18 hr',bake:'35–40 min',tempC:240,ingredients:[['Bread flour',500,'g','flour'],['Water',360,'ml','water'],['Instant yeast',1,'g','yeast'],['Salt',10,'g','salt']],steps:['Mix everything until no dry flour remains.','Cover and ferment 12–18 hr at cool room temperature.','Shape gently and rest 45–60 min.','Score and bake with steam or in a preheated Dutch oven.']},
{id:'burger-buns',category:'Bread',title:'Soft Burger Buns',hydration:62,hydrationMin:58,hydrationMax:66,adjustableHydration:true,desc:'Soft, rich buns that stay light but hold a burger well.',yield:'8 buns',prep:'25 min',ferment:'2½ hr',bake:'15–18 min',tempC:200,ingredients:[['Bread flour',500,'g','flour'],['Milk',310,'ml','water'],['Instant yeast',7,'g','yeast'],['Salt',9,'g','salt'],['Sugar',35,'g','sugar'],['Butter',45,'g','fat'],['Egg',1,'pc','egg']],steps:['Mix flour, milk and yeast. Rest 10 min.','Add salt, sugar, egg and butter. Knead smooth.','Bulk ferment 60–75 min.','Divide into 8, shape tight balls and proof 45–60 min.','Brush with egg or milk and bake until golden.']},
{id:'dinner-rolls',category:'Bread',title:'Dinner Rolls',hydration:64,hydrationMin:60,hydrationMax:68,adjustableHydration:true,desc:'Soft pull-apart rolls for dinner or sandwiches.',yield:'12 rolls',prep:'20 min',ferment:'2½ hr',bake:'18–22 min',tempC:195,ingredients:[['Bread flour',500,'g','flour'],['Milk',320,'ml','water'],['Instant yeast',6,'g','yeast'],['Salt',9,'g','salt'],['Sugar',25,'g','sugar'],['Butter',40,'g','fat']],steps:['Mix flour, milk and yeast. Rest 10 min.','Add salt, sugar and butter. Knead until elastic.','Bulk ferment 60–75 min.','Divide into 12, shape and place close together in a tray.','Proof 45–60 min and bake until golden.']},
{id:'simple-sourdough',category:'Bread',title:'Simple Sourdough',hydration:72,hydrationMin:68,hydrationMax:82,adjustableHydration:true,desc:'Straightforward sourdough with a flexible hydration range.',yield:'1 loaf',prep:'25 min',ferment:'8–16 hr',bake:'40–45 min',tempC:240,ingredients:[['Bread flour',450,'g','flour'],['Whole wheat flour',50,'g','flour'],['Water',360,'ml','water'],['Active starter',100,'g','starter'],['Salt',10,'g','salt']],steps:['Mix flours and most of the water. Rest 30 min.','Add starter and salt; mix thoroughly.','Bulk ferment 4–6 hr with folds during the first 2 hr.','Shape and cold proof 8–12 hr.','Score and bake in a hot Dutch oven or with steam.']},
{id:'drommekage',category:'Cake',title:'Drømmekage / Sjónvarpskaka',desc:'Soft vanilla cake with warm brown-sugar coconut topping.',yield:'1 × 30 × 40 cm tray',prep:'20 min',bake:'40–45 min',tempC:175,ingredients:[['Eggs',4,'pc','egg'],['Sugar',300,'g','sugar'],['Vanilla extract',10,'ml','liquid'],['Flour',250,'g','flour'],['Baking powder',12,'g','leavener'],['Butter',50,'g','fat'],['Milk',200,'ml','liquid'],['Butter — topping',100,'g','fat'],['Brown sugar — topping',200,'g','sugar'],['Milk — topping',70,'ml','liquid'],['Desiccated coconut',150,'g','coconut']],steps:['Beat eggs, sugar and vanilla until pale and fluffy.','Fold in flour and baking powder. Mix in melted butter and milk.','Pour into lined 30 × 40 cm tray. Bake 30–35 min.','Melt topping butter, brown sugar and milk; stir in coconut.','Spread over cake and bake about 10 min more until golden.']},
{id:'bounty-cake',category:'Cake',title:'Bounty Cake',desc:'Gotterí Bounty kaka — coconut cake with chocolate cream.',yield:'1 cake',prep:'20 min',bake:'40 min',tempC:150,ingredients:[['Egg whites',4,'pc','egg'],['Icing sugar — cake',140,'g','sugar'],['Desiccated coconut',140,'g','coconut'],['Butter — cream',100,'g','fat'],['Dark baking chocolate',100,'g','chocolate'],['Icing sugar — cream',60,'g','sugar'],['Egg yolks',4,'pc','egg'],['Desiccated coconut — finish',10,'g','coconut']],steps:['Beat egg whites with 140 g icing sugar until thick and fluffy.','Fold in 140 g coconut. Bake at 150°C for about 40 min. Cool.','Melt butter and chocolate together over a water bath. Set aside briefly.','Beat egg yolks with 60 g icing sugar until pale and light.','Fold in the chocolate mixture. Spread over the cooled cake and sprinkle with coconut.']},
{id:'carrot-cake',category:'Cake',title:'Carrot Cake',desc:'Moist spiced carrot cake with simple cream-cheese frosting.',yield:'1 × 23 cm cake',prep:'25 min',bake:'40–45 min',tempC:175,ingredients:[['Flour',250,'g','flour'],['Brown sugar',180,'g','sugar'],['Baking powder',8,'g','leavener'],['Cinnamon',5,'g','spice'],['Eggs',3,'pc','egg'],['Neutral oil',180,'ml','fat'],['Grated carrot',300,'g','vegetable'],['Cream cheese',250,'g','dairy'],['Butter — frosting',60,'g','fat'],['Icing sugar',100,'g','sugar']],steps:['Mix flour, sugar, baking powder and cinnamon.','Whisk eggs and oil; fold into dry ingredients, then add carrot.','Bake until set and a skewer comes out clean. Cool fully.','Beat cream cheese, butter and icing sugar. Spread over cake.']},
{id:'chocolate-cake',category:'Cake',title:'Simple Chocolate Cake',desc:'Deep chocolate flavour, soft crumb, straightforward method.',yield:'1 × 23 cm cake',prep:'20 min',bake:'30–35 min',tempC:180,ingredients:[['Flour',220,'g','flour'],['Cocoa powder',60,'g','cocoa'],['Sugar',220,'g','sugar'],['Baking powder',8,'g','leavener'],['Eggs',2,'pc','egg'],['Milk',200,'ml','liquid'],['Neutral oil',100,'ml','fat'],['Hot coffee',150,'ml','liquid']],steps:['Mix flour, cocoa, sugar and baking powder.','Whisk in eggs, milk and oil. Stir in hot coffee last.','Pour into tin and bake until just set.','Cool before slicing or frosting.']}
,{id:'cinnabon-rolls',category:'Bread',title:'Cinnabon-Style Cinnamon Rolls',desc:'Soft cinnamon rolls with cream-cheese frosting.',yield:'20–24 rolls',prep:'35 min',ferment:'2–2½ hr',bake:'22–28 min',tempC:180,ingredients:[['Bread flour',1000,'g','flour'],['Whole milk',500,'ml','liquid'],['Instant dry yeast',14,'g','yeast'],['Sugar',140,'g','sugar'],['Eggs',2,'pc','egg'],['Egg yolks',2,'pc','egg'],['Butter — dough',150,'g','fat'],['Salt',16,'g','salt'],['Butter — filling',200,'g','fat'],['Dark brown sugar',320,'g','sugar'],['Ground cinnamon',30,'g','spice'],['Cream cheese',240,'g','dairy'],['Butter — frosting',100,'g','fat'],['Icing sugar',200,'g','sugar'],['Vanilla extract',10,'ml','liquid'],['Milk — frosting',45,'ml','liquid']],steps:['Mix flour, yeast, sugar, milk, eggs and yolks. Knead 5 min.','Work in butter and salt; knead 8–10 min until elastic. Rise 1–1½ hr.','Divide dough in 2 and roll each to about 40 × 30 cm.','Spread butter; add brown sugar, cinnamon and salt. Roll up and cut 10–12 pieces per log.','Proof 40–60 min. Bake at 180°C conventional / 170°C fan for 22–28 min.','Beat frosting ingredients smooth and spread over warm rolls.']}
,{id:'pavlova-lemon-curd',category:'Dessert',title:'Pavlova with Lemon Curd',desc:'Crisp meringue shell, soft centre and sharp lemon curd.',yield:'1 × 22–24 cm',prep:'25 min',bake:'75–90 min',tempC:120,ingredients:[['Egg whites',4,'pc','egg'],['Caster sugar',250,'g','sugar'],['Cornstarch',6,'g','other'],['Lemon juice or white vinegar',5,'ml','liquid'],['Vanilla extract',5,'ml','liquid'],['Egg yolks — curd',4,'pc','egg'],['Caster sugar — curd',100,'g','sugar'],['Lemon zest',2,'pc','other'],['Lemon juice',100,'ml','liquid'],['Butter',85,'g','fat']],steps:['Whip egg whites to soft peaks. Add sugar gradually until glossy and dissolved.','Fold in cornstarch, acid and vanilla. Shape on baking paper.','Heat oven to 150°C, put pavlova in, immediately reduce to 120°C and bake 75–90 min. Cool in switched-off oven.','For curd, whisk yolks, sugar, zest and juice over low heat until thick.','Remove from heat and whisk in butter. Chill, then spoon onto pavlova.']}
,{id:'apple-crumb-cake',category:'Cake',title:'Apple Crumb Cake',desc:'Moist apple cake with cinnamon crumb topping.',yield:'1 × 23 cm cake',prep:'20 min',bake:'35–40 min',tempC:175,ingredients:[['Flour',250,'g','flour'],['Sugar',150,'g','sugar'],['Baking powder',8,'g','leavener'],['Baking soda',2.5,'g','leavener'],['Salt',2,'g','salt'],['Cinnamon',5,'g','spice'],['Eggs',2,'pc','egg'],['Neutral oil',120,'ml','fat'],['Buttermilk',240,'ml','liquid'],['Vanilla extract',5,'ml','liquid'],['Apples, chopped',325,'g','fruit'],['Flour — crumb',95,'g','flour'],['Brown sugar — crumb',100,'g','sugar'],['Cinnamon — crumb',5,'g','spice'],['Butter — crumb',55,'g','fat']],steps:['Heat oven to 175°C. Grease and line a 23 cm pan.','Mix dry cake ingredients. Whisk eggs, oil, buttermilk and vanilla separately.','Combine wet and dry just until mixed; fold in apples.','Mix crumb flour, brown sugar and cinnamon; stir in melted butter. Scatter over batter.','Bake 35–40 min until a skewer comes out clean.']}
,{id:'choc-orange-cheesecake',category:'Cake',title:'Chocolate Orange Cheesecake',desc:'Baked chocolate cheesecake with orange and ganache topping.',yield:'1 × 18 cm / 6 servings',prep:'30 min',bake:'80 min',tempC:160,ingredients:[['Digestive biscuits',120,'g','other'],['Butter — base',50,'g','fat'],['Sugar',75,'g','sugar'],['Orange zest',0.5,'pc','fruit'],['Eggs',125,'g','egg'],['Mascarpone',245,'g','dairy'],['Cream cheese',490,'g','dairy'],['Sour cream',35,'g','dairy'],['Dark chocolate',175,'g','chocolate'],['Cocoa powder',8,'g','cocoa'],['Heavy cream — topping',150,'ml','liquid'],['Honey',25,'g','sugar'],['Dark chocolate — topping',90,'g','chocolate'],['Butter — topping',35,'g','fat']],steps:['Crush biscuits, mix with melted butter and press into 18 cm tin. Chill.','Whisk sugar, orange zest and eggs briefly. Mix in mascarpone, cream cheese and sour cream.','Mix in melted chocolate and cocoa. Pour over base.','Bake in a water bath at 160°C for about 80 min; centre should wobble slightly. Cool, then chill overnight.','Heat cream and honey; pour over topping chocolate. Stir smooth, add butter and pour over cheesecake.']}
,{id:'date-cake-caramel',category:'Cake',title:'Date Cake with Caramel Sauce',desc:'Soft date cake served with warm caramel sauce.',yield:'1 cake',prep:'25 min',bake:'35–40 min',tempC:180,ingredients:[['Sugar',60,'g','sugar'],['Butter',120,'g','fat'],['Eggs',2,'pc','egg'],['Flour',100,'g','flour'],['Dates',210,'g','fruit'],['Baking soda',5,'g','leavener'],['Cinnamon',2.5,'g','spice'],['Salt',2.5,'g','salt'],['Vanilla extract',2.5,'ml','liquid'],['Baking powder',6,'g','leavener'],['Butter — sauce',120,'g','fat'],['Cream — sauce',150,'ml','liquid'],['Brown sugar — sauce',120,'g','sugar']],steps:['Heat oven to 180°C. Cover dates with water, boil, remove from heat 3–4 min and mash lightly. Stir in baking soda.','Beat butter and sugar fluffy; add eggs one at a time.','Mix in flour, cinnamon, salt, baking powder and vanilla, then fold in date mixture.','Bake 35–40 min.','For sauce, boil butter, cream and brown sugar together until slightly thickened but still pourable.']}
,{id:'strawberry-foam',category:'Dessert',title:'Espumilla de Frutilla',desc:'Light strawberry foam dessert.',yield:'4 servings',prep:'20 min',ingredients:[['Strawberries, puréed',400,'g','fruit'],['White sugar',400,'g','sugar'],['Egg white',1,'pc','egg']],steps:['Put egg white and about 2 tbsp sugar in a heatproof bowl over a bain-marie.','Whisk about 10 min, heating mixture to at least 72°C.','Add remaining sugar and strawberry purée.','Beat 10–15 min until thick, fluffy and pale pink.']}
,{id:'lemon-meringue-cheesecake',category:'Cake',title:'Lemon Meringue Cheesecake',desc:'Baked lemon cheesecake with lemon curd and meringue.',yield:'1 × 23 cm / 10 slices',prep:'35 min',bake:'60 min',tempC:140,ingredients:[['Digestive biscuits',200,'g','other'],['Butter — crust',113,'g','fat'],['Sugar — crust',12,'g','sugar'],['Cream cheese',550,'g','dairy'],['Sugar',200,'g','sugar'],['Lemon zest',15,'g','fruit'],['Vanilla extract',5,'ml','liquid'],['Sour cream',100,'g','dairy'],['Eggs',3,'pc','egg'],['Lemon juice',60,'ml','liquid'],['Cornstarch',16,'g','other'],['Lemon juice — curd',80,'ml','liquid'],['Sugar — curd',135,'g','sugar'],['Butter — curd',80,'g','fat'],['Egg — curd',1,'pc','egg'],['Egg yolks — curd',3,'pc','egg'],['Egg whites — meringue',3,'pc','egg'],['Sugar — meringue',150,'g','sugar'],['Cream of tartar',2,'g','other']],steps:['Bake biscuit crust 7–8 min at 180°C. Reduce oven to 140°C.','Mix cream cheese, sugar, zest and vanilla. Add sour cream, lemon juice and eggs gently; mix in cornstarch.','Pour over crust and bake about 1 hr until edges are set and centre jiggles slightly. Cool gradually and chill at least 5 hr.','Cook lemon curd ingredients gently until thick; chill and spread over cheesecake.','Whisk meringue ingredients over simmering water until sugar dissolves, then beat to stiff glossy peaks. Spread over curd and torch lightly.']}

const LS={recipes:'quickrecipe.recipes.v1',favs:'quickrecipe.favs.v1',unit:'quickrecipe.unit.v1'};
let recipes=mergeSeedRecipes(load(LS.recipes,seedRecipes)),favs=new Set(load(LS.favs,[])),unit=localStorage.getItem(LS.unit)||'metric',selectedId=recipes.find(r=>r.id==='ciabatta')?.id||recipes[0]?.id||null,scale=1,view='amounts',category='All',onlyFavs=false,editingId=null,hydrationState={};
function load(k,f){try{let x=localStorage.getItem(k);return x?JSON.parse(x):structuredClone(f)}catch{return structuredClone(f)}}
function mergeSeedRecipes(existing){const byId=new Map(seedRecipes.map(r=>[r.id,r]));const merged=existing.map(r=>{const seed=byId.get(r.id);return seed?{...r,...seed}:r});const ids=new Set(merged.map(r=>r.id));seedRecipes.forEach(r=>{if(!ids.has(r.id))merged.push(structuredClone(r))});return merged}
function saveAll(){localStorage.setItem(LS.recipes,JSON.stringify(recipes));localStorage.setItem(LS.favs,JSON.stringify([...favs]));localStorage.setItem(LS.unit,unit)}
const fmt=n=>{const r=Math.round(n*100)/100;return Number.isInteger(r)?String(r):r.toFixed(r<10?2:1).replace(/0+$/,'').replace(/\.$/,'')};
const cToF=c=>Math.round(c*9/5+32),gToOz=g=>g*.0352739619,mlToFloz=ml=>ml*.0338140227;
function amountText(v,u){v*=scale;if(unit==='metric')return `${fmt(v)} ${u}`;if(u==='g')return `${fmt(gToOz(v))} oz`;if(u==='ml')return `${fmt(mlToFloz(v))} fl oz`;return `${fmt(v)} ${u}`}
function flourTotal(r){return r.ingredients.filter(x=>x[3]==='flour').reduce((n,x)=>n+Number(x[1]||0),0)}
function currentHydration(r){return hydrationState[r.id]??Number(r.hydration||0)}
function adjustedIngredientValue(r,ing){if(!r.adjustableHydration||ing[3]!=='water')return Number(ing[1]);const waters=r.ingredients.filter(x=>x[3]==='water');const baseTotal=waters.reduce((n,x)=>n+Number(x[1]||0),0);if(!baseTotal)return Number(ing[1]);const target=flourTotal(r)*currentHydration(r)/100;return target*(Number(ing[1])/baseTotal)}
function bakers(r,ing){const flour=flourTotal(r);return flour?`${fmt(adjustedIngredientValue(r,ing)/flour*100)}%`:'—'}
const sectionPlans={
'drommekage':[[0,'Cake'],[7,'Coconut topping']],
'bounty-cake':[[0,'Coconut cake'],[3,'Chocolate cream'],[7,'Finish']],
'carrot-cake':[[0,'Cake'],[7,'Frosting']],
'cinnabon-rolls':[[0,'Dough'],[8,'Filling'],[11,'Frosting']],
'pavlova-lemon-curd':[[0,'Pavlova'],[5,'Lemon curd']],
'apple-crumb-cake':[[0,'Cake'],[11,'Crumb topping']],
'choc-orange-cheesecake':[[0,'Base'],[2,'Filling'],[10,'Topping']],
'date-cake-caramel':[[0,'Cake'],[10,'Caramel sauce']],
'lemon-meringue-cheesecake':[[0,'Crust'],[3,'Filling'],[11,'Lemon curd'],[16,'Meringue']]
};
function sectionFor(r,idx,name){const plan=sectionPlans[r.id];if(plan){let sec='';for(const [start,label] of plan){if(idx>=start)sec=label;else break}return sec}const m=String(name).match(/\s+—\s+(.+)$/);return m?m[1].replace(/\b\w/g,c=>c.toUpperCase()):''}
function cleanIngredientName(name){return String(name).replace(/\s+—\s+.+$/,'')}
function renderIngredients(r){let last='';return r.ingredients.map((i,idx)=>{const sec=sectionFor(r,idx,i[0]);const head=sec&&sec!==last?`<div class="ingredient-section">${esc(sec)}</div>`:'';last=sec||last;return `${head}<div class="ingredient"><span>${esc(cleanIngredientName(i[0]))}</span><span class="amount">${view==='bakers'?bakers(r,i):amountText(adjustedIngredientValue(r,i),i[2])}</span></div>`}).join('')}
let wakeLock=null;
async function requestWakeLock(){if(!selectedId||document.visibilityState!=='visible'||!('wakeLock' in navigator)||wakeLock)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}catch(e){wakeLock=null}}
async function releaseWakeLock(){if(!wakeLock)return;try{await wakeLock.release()}catch(e){}wakeLock=null}
function categories(){return ['All',...new Set(recipes.map(r=>r.category||'Other'))]}
function renderChips(){document.getElementById('chips').innerHTML=categories().map(c=>`<button class="chip ${category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()})}
function matches(r,q){q=q.toLowerCase();return !q||r.title.toLowerCase().includes(q)||(r.desc||'').toLowerCase().includes(q)||r.ingredients.some(i=>i[0].toLowerCase().includes(q))}
function renderList(){const q=document.getElementById('search').value.trim();const shown=recipes.filter(r=>(category==='All'||r.category===category)&&(!onlyFavs||favs.has(r.id))&&matches(r,q));if(!shown.some(r=>r.id===selectedId)&&shown[0])selectedId=shown[0].id;document.getElementById('list').innerHTML=shown.map(r=>`<button class="card ${r.id===selectedId?'active':''}" data-id="${r.id}"><div class="card-top"><div><div class="tag">${esc(r.category||'Recipe')}</div><h3>${esc(r.title)}</h3></div><span class="heart ${favs.has(r.id)?'on':''}" data-fav="${r.id}">${favs.has(r.id)?'♥':'♡'}</span></div><div class="desc">${esc(r.desc||'')}</div><div class="stats">${r.hydration?`<span class="stat">${fmt(r.hydration)}% hydration</span>`:''}${r.bake?`<span class="stat">${esc(r.bake)}</span>`:''}</div></button>`).join('')||'<div class="empty">No recipes found.</div>';document.querySelectorAll('.card[data-id]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-fav]'))return;selectedId=b.dataset.id;scale=1;view='amounts';render()});document.querySelectorAll('[data-fav]').forEach(h=>h.onclick=e=>{e.stopPropagation();toggleFav(h.dataset.fav)})}
function renderDetail(){const r=recipes.find(x=>x.id===selectedId);const el=document.getElementById('detail');if(!r){releaseWakeLock();el.innerHTML='<div class="empty" style="margin:22px">Choose or add a recipe.</div>';return}requestWakeLock();const temp=unit==='metric'?`${r.tempC||0}°C`:`${cToF(r.tempC||0)}°F`;const hyd=currentHydration(r);const hydrationControl=r.adjustableHydration?`<div class="hydration-box"><div class="hydration-row"><strong>Hydration</strong><button class="mini-btn" id="hydMinus">−</button><input id="hydRange" type="range" min="${r.hydrationMin||50}" max="${r.hydrationMax||90}" step="1" value="${hyd}"><button class="mini-btn" id="hydPlus">＋</button><span class="hydration-value" id="hydValue">${fmt(hyd)}%</span><button class="mini-btn" id="hydReset">Reset</button></div><div class="hydration-help">Adjusts the liquid automatically. Recipe range: ${fmt(r.hydrationMin)}–${fmt(r.hydrationMax)}%.</div></div>`:'';el.innerHTML=`<div class="detail-head"><div class="detail-title-row"><div><div class="tag">${esc(r.category||'Recipe')}${r.hydration?` · ${fmt(hyd)}% hydration`:''}</div><h1>${esc(r.title)}</h1><div class="desc">${esc(r.desc||'')}</div></div><div class="detail-actions"><button class="btn" id="detailFav">${favs.has(r.id)?'♥ Saved':'♡ Save'}</button><button class="btn" id="editBtn">Edit</button></div></div><div class="detail-actions" style="justify-content:flex-start;margin-top:16px"><div class="seg">${[.5,1,2,3].map(s=>`<button data-scale="${s}" class="${scale===s?'active':''}">${s===.5?'½':s}×</button>`).join('')}</div>${r.ingredients.some(i=>i[3]==='flour')?`<div class="seg"><button data-view="amounts" class="${view==='amounts'?'active':''}">Amounts</button><button data-view="bakers" class="${view==='bakers'?'active':''}">Baker's %</button></div>`:''}</div>${hydrationControl}</div><div class="detail-body"><section class="pane"><h2>Ingredients</h2>${renderIngredients(r)}</section><section class="pane"><h2>Method</h2><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section></div><div class="meta">${r.prep?`<span class="stat">Prep ${esc(r.prep)}</span>`:''}${r.ferment?`<span class="stat">Rest ${esc(r.ferment)}</span>`:''}${r.bake?`<span class="stat">Bake ${esc(r.bake)}</span>`:''}${r.tempC?`<span class="stat">${temp}</span>`:''}${r.yield?`<span class="stat">${esc(r.yield)}</span>`:''}</div>`;document.querySelectorAll('[data-scale]').forEach(b=>b.onclick=()=>{scale=Number(b.dataset.scale);renderDetail()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;renderDetail()});if(r.adjustableHydration){const setHyd=v=>{hydrationState[r.id]=Math.max(Number(r.hydrationMin),Math.min(Number(r.hydrationMax),Number(v)));renderDetail()};document.getElementById('hydRange').oninput=e=>setHyd(e.target.value);document.getElementById('hydMinus').onclick=()=>setHyd(hyd-1);document.getElementById('hydPlus').onclick=()=>setHyd(hyd+1);document.getElementById('hydReset').onclick=()=>{delete hydrationState[r.id];renderDetail()}}document.getElementById('detailFav').onclick=()=>toggleFav(r.id);document.getElementById('editBtn').onclick=()=>openModal(r)}
function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);saveAll();render();toast(favs.has(id)?'Saved to favourites':'Removed from favourites')}
function render(){document.getElementById('metricBtn').classList.toggle('active',unit==='metric');document.getElementById('imperialBtn').classList.toggle('active',unit==='imperial');document.getElementById('favFilter').classList.toggle('primary',onlyFavs);renderChips();renderList();renderDetail()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openModal(r=null){editingId=r?.id||null;document.getElementById('modalTitle').textContent=r?'Edit recipe':'Add recipe';document.getElementById('deleteBtn').style.visibility=r?'visible':'hidden';const set=(id,v='')=>document.getElementById(id).value=v;set('fTitle',r?.title);set('fCategory',r?.category||'Bread');set('fDesc',r?.desc);set('fYield',r?.yield);set('fTemp',r?.tempC);set('fPrep',r?.prep);set('fFerment',r?.ferment);set('fBake',r?.bake);set('fHydration',r?.hydration);set('fIngredients',r?.ingredients?.map(i=>i.join(' | ')).join('\n'));set('fSteps',r?.steps?.join('\n'));document.getElementById('modalBackdrop').classList.add('show');setTimeout(()=>document.getElementById('fTitle').focus(),50)}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function parseIngredients(txt){return txt.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{let [name,amount,unitName,role='']=line.split('|').map(x=>x.trim());return [name,Number(amount),unitName||'',role]})}
function saveRecipe(){const title=document.getElementById('fTitle').value.trim(),ingredients=parseIngredients(document.getElementById('fIngredients').value),steps=document.getElementById('fSteps').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!title||!ingredients.length||ingredients.some(i=>!i[0]||!Number.isFinite(i[1]))||!steps.length){toast('Add a name, valid ingredients and method steps');return}const data={id:editingId||`r_${Date.now()}`,title,category:document.getElementById('fCategory').value.trim()||'Other',desc:document.getElementById('fDesc').value.trim(),yield:document.getElementById('fYield').value.trim(),tempC:Number(document.getElementById('fTemp').value)||0,prep:document.getElementById('fPrep').value.trim(),ferment:document.getElementById('fFerment').value.trim(),bake:document.getElementById('fBake').value.trim(),hydration:Number(document.getElementById('fHydration').value)||0,ingredients,steps};if(editingId){recipes=recipes.map(r=>r.id===editingId?data:r)}else recipes.unshift(data);selectedId=data.id;category='All';saveAll();closeModal();render();toast(editingId?'Recipe updated':'Recipe added')}
function deleteRecipe(){if(!editingId)return;recipes=recipes.filter(r=>r.id!==editingId);favs.delete(editingId);selectedId=recipes[0]?.id||null;saveAll();closeModal();render();toast('Recipe deleted')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800)}
document.getElementById('search').oninput=render;document.getElementById('metricBtn').onclick=()=>{unit='metric';saveAll();render()};document.getElementById('imperialBtn').onclick=()=>{unit='imperial';saveAll();render()};document.getElementById('favFilter').onclick=()=>{onlyFavs=!onlyFavs;render()};document.getElementById('addBtn').onclick=()=>openModal();document.getElementById('cancelBtn').onclick=closeModal;document.getElementById('saveBtn').onclick=saveRecipe;document.getElementById('deleteBtn').onclick=deleteRecipe;document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWakeLock();else releaseWakeLock()});window.addEventListener('pagehide',releaseWakeLock);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script>
