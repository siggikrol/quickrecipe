<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1712"  media="(prefers-color-scheme: dark)" />
  <meta name="description" content="QuickRecipe — your personal recipe-first cooking companion. Manage bread, bakes and more with baker's percentages, hydration control and unit conversion." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <title>QuickRecipe</title>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="top">
      <div class="brand-wrap">
        <div class="tag">Recipe-first cooking</div>
        <div class="brand">QuickRecipe</div>
      </div>
      <div class="top-actions">
        <button class="btn" id="favFilter">♡ <span>Favourites</span></button>
        <button class="btn primary" id="addBtn">＋ <span>Add recipe</span></button>
      </div>
    </header>

    <!-- Toolbar -->
    <section class="toolbar">
      <input id="search" class="search" placeholder="Search recipes or ingredients…" aria-label="Search recipes" />
      <div class="units" role="group" aria-label="Unit system">
        <button id="metricBtn">Metric</button>
        <button id="imperialBtn">Imperial</button>
      </div>
    </section>

    <!-- Category chips -->
    <div id="chips" class="chips" role="list" aria-label="Recipe categories"></div>

    <!-- Main layout -->
    <main class="layout">
      <section id="list"   class="list"   aria-label="Recipe list"></section>
      <section id="detail" class="detail" aria-label="Recipe detail" aria-live="polite"></section>
    </main>

  </div><!-- /.app -->

  <!-- Add / Edit modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Add recipe</h2>
      <div class="form-grid">

        <div class="field">
          <label for="fTitle">Name</label>
          <input id="fTitle" autocomplete="off" />
        </div>
        <div class="field">
          <label for="fCategory">Category</label>
          <input id="fCategory" placeholder="Bread" autocomplete="off" />
        </div>

        <div class="field full">
          <label for="fDesc">Short description</label>
          <input id="fDesc" autocomplete="off" />
        </div>

        <div class="field">
          <label for="fYield">Yield</label>
          <input id="fYield" placeholder="2 loaves" autocomplete="off" />
        </div>
        <div class="field">
          <label for="fTemp">Oven °C</label>
          <input id="fTemp" type="number" placeholder="230" />
        </div>

        <div class="field">
          <label for="fPrep">Prep</label>
          <input id="fPrep" placeholder="15 min" autocomplete="off" />
        </div>
        <div class="field">
          <label for="fFerment">Ferment / rest</label>
          <input id="fFerment" placeholder="3 hr" autocomplete="off" />
        </div>

        <div class="field">
          <label for="fBake">Bake</label>
          <input id="fBake" placeholder="25 min" autocomplete="off" />
        </div>
        <div class="field">
          <label for="fHydration">Hydration %</label>
          <input id="fHydration" type="number" step="0.1" placeholder="72" />
        </div>

        <div class="field full">
          <label for="fIngredients">Ingredients — one per line</label>
          <textarea id="fIngredients" placeholder="Bread flour | 500 | g | flour&#10;Water | 360 | ml | water&#10;Salt | 10 | g | salt"></textarea>
          <div class="help">Format: name | amount | unit | role. Role is optional; use "flour" to enable baker's %.</div>
        </div>

        <div class="field full">
          <label for="fSteps">Method — one step per line</label>
          <textarea id="fSteps" placeholder="Mix ingredients.&#10;Bulk ferment 2 hours.&#10;Shape and proof.&#10;Bake."></textarea>
        </div>

      </div><!-- /.form-grid -->

      <div class="modal-actions">
        <button class="btn ghost-danger" id="deleteBtn">Delete</button>
        <div class="right-actions">
          <button class="btn" id="cancelBtn">Cancel</button>
          <button class="btn primary" id="saveBtn">Save recipe</button>
        </div>
      </div>
    </div><!-- /.modal -->
  </div><!-- /.modal-backdrop -->

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
