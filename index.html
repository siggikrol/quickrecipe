<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4efe6" />
<link rel="manifest" href="manifest.webmanifest" />
<title>QuickRecipe</title>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#211f1a;--muted:#746f65;--line:#ddd4c7;--accent:#b65632;--soft:#f3dfd5;--danger:#9e3535;--shadow:0 14px 36px rgba(46,39,31,.08)}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1160px;margin:auto;padding:24px 18px 64px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-family:Georgia,serif;font-size:34px;font-weight:700;letter-spacing:-1px}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:800}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 13px}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.ghost-danger{color:var(--danger)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:20px 0 12px}.search{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;outline:none}.units{display:flex;background:#e8e0d5;border-radius:12px;padding:3px}.units button{border:0;background:transparent;padding:9px 12px;border-radius:9px;color:var(--muted)}.units .active{background:var(--card);color:var(--ink);font-weight:700}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 16px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 11px}.chip.active{background:var(--ink);border-color:var(--ink);color:white}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.list{display:grid;gap:10px;align-content:start}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px;box-shadow:var(--shadow);text-align:left;width:100%}.card.active{outline:2px solid var(--accent)}.card-top{display:flex;justify-content:space-between;gap:10px}.card h3{font-size:19px;margin:5px 0 6px}.desc{color:var(--muted);font-size:13px}.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.stat{font-size:11px;background:#f0e9df;border-radius:999px;padding:6px 8px}.heart{font-size:20px;line-height:1;color:#b5aaa0}.heart.on{color:#ba4b44}.detail{border:1px solid var(--line);background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;min-height:500px}.detail-head{padding:22px;border-bottom:1px solid var(--line)}.detail-title-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.detail h1{font-family:Georgia,serif;font-size:38px;line-height:1.05;margin:5px 0 7px}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}.seg button{border:0;background:transparent;padding:8px 10px;color:var(--muted)}.seg button.active{background:var(--soft);color:var(--accent);font-weight:700}.detail-body{display:grid;grid-template-columns:1fr 1.1fr}.pane{padding:22px}.pane+.pane{border-left:1px solid var(--line)}.pane h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin:0 0 12px}.ingredient{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid #eee7dd}.ingredient:last-child{border-bottom:0}.amount{font-weight:750;white-space:nowrap}.steps{margin:0;padding-left:22px}.steps li{padding-left:5px;margin-bottom:12px}.meta{display:flex;gap:7px;flex-wrap:wrap;padding:15px 22px 20px;border-top:1px solid var(--line)}.empty{border:1px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(24,21,18,.5);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:10}.modal-backdrop.show{display:flex}.modal{background:var(--card);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.modal h2{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:white;border-radius:10px;padding:10px}.field textarea{min-height:90px;resize:vertical}.help{font-size:12px;color:var(--muted)}.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.right-actions{display:flex;gap:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:white;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:840px){.layout{grid-template-columns:1fr}.list{grid-template-columns:repeat(2,1fr)}.detail{grid-row:1}.detail-body{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:560px){.app{padding:18px 12px 50px}.brand{font-size:28px}.top{align-items:flex-start}.top-actions .btn span{display:none}.toolbar{grid-template-columns:1fr}.list{grid-template-columns:1fr}.detail-title-row{display:block}.detail-actions{justify-content:flex-start;margin-top:14px}.detail h1{font-size:34px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:16px}.modal-backdrop{padding:0;align-items:flex-end}.modal{border-radius:22px 22px 0 0;max-height:94vh}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="tag">Recipe-first cooking</div><div class="brand">QuickRecipe</div></div>
    <div class="top-actions"><button class="btn" id="favFilter">♡ <span>Favourites</span></button><button class="btn primary" id="addBtn">＋ <span>Add recipe</span></button></div>
  </header>
  <section class="toolbar"><input id="search" class="search" placeholder="Search recipes or ingredients…"><div class="units"><button id="metricBtn">Metric</button><button id="imperialBtn">Imperial</button></div></section>
  <div id="chips" class="chips"></div>
  <main class="layout"><section id="list" class="list"></section><section id="detail" class="detail"></section></main>
</div>

<div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="modalTitle">Add recipe</h2>
    <div class="form-grid">
      <div class="field"><label>Name</label><input id="fTitle"></div>
      <div class="field"><label>Category</label><input id="fCategory" placeholder="Bread"></div>
      <div class="field full"><label>Short description</label><input id="fDesc"></div>
      <div class="field"><label>Yield</label><input id="fYield" placeholder="2 loaves"></div>
      <div class="field"><label>Oven °C</label><input id="fTemp" type="number" placeholder="230"></div>
      <div class="field"><label>Prep</label><input id="fPrep" placeholder="15 min"></div>
      <div class="field"><label>Ferment / rest</label><input id="fFerment" placeholder="3 hr"></div>
      <div class="field"><label>Bake</label><input id="fBake" placeholder="25 min"></div>
      <div class="field"><label>Hydration %</label><input id="fHydration" type="number" step="0.1" placeholder="72"></div>
      <div class="field full"><label>Ingredients — one per line</label><textarea id="fIngredients" placeholder="Bread flour | 500 | g | flour\nWater | 360 | ml | water\nSalt | 10 | g | salt"></textarea><div class="help">Format: name | amount | unit | role. Role is optional; use “flour” to enable baker’s %.</div></div>
      <div class="field full"><label>Method — one step per line</label><textarea id="fSteps" placeholder="Mix ingredients.\nBulk ferment 2 hours.\nShape and proof.\nBake."></textarea></div>
    </div>
    <div class="modal-actions"><button class="btn ghost-danger" id="deleteBtn">Delete</button><div class="right-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save recipe</button></div></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const seedRecipes=[
{id:'white',category:'Bread',title:'Classic White Bread',hydration:65,desc:'Simple everyday loaf with a soft crumb and crisp top.',yield:'1 loaf',prep:'15 min',ferment:'2½–3 hr',bake:'30–35 min',tempC:220,ingredients:[['Bread flour',500,'g','flour'],['Water',325,'ml','water'],['Instant yeast',6,'g','yeast'],['Salt',10,'g','salt'],['Butter',20,'g','fat']],steps:['Mix flour, water and yeast. Rest 15 min.','Add salt and butter. Knead until smooth and elastic.','Bulk ferment 60–90 min, until doubled.','Shape, place in loaf tin, proof 45–60 min.','Bake until deep golden and fully set.']},
{id:'ciabatta',category:'Bread',title:'Ciabatta',hydration:72,desc:'Open crumb, thin crisp crust, minimal handling.',yield:'2 loaves',prep:'15 min',ferment:'3½–4 hr',bake:'20–25 min',tempC:240,ingredients:[['Bread flour',500,'g','flour'],['Water',360,'ml','water'],['Instant yeast',2,'g','yeast'],['Salt',10,'g','salt'],['Olive oil',15,'ml','fat']],steps:['Mix flour, water and yeast. Rest 20 min.','Add salt and oil. Mix until developed.','Bulk ferment 2–3 hr; stretch and fold 3× during first 90 min.','Divide gently. Proof 45–60 min.','Bake hot until crisp and well coloured.']},
{id:'focaccia',category:'Bread',title:'Focaccia',hydration:75,desc:'Airy interior, olive-oil crust, easy tray bake.',yield:'1 tray',prep:'15 min',ferment:'3–4 hr',bake:'22–28 min',tempC:230,ingredients:[['Bread flour',500,'g','flour'],['Water',375,'ml','water'],['Instant yeast',4,'g','yeast'],['Salt',10,'g','salt'],['Olive oil',35,'ml','fat']],steps:['Mix flour, water and yeast. Rest 20 min.','Add salt and half the oil. Fold until cohesive.','Bulk ferment 2 hr with 2–3 folds.','Transfer to oiled tray. Proof 60–90 min.','Dimple, add remaining oil and salt. Bake until deeply golden.']},
{id:'baguette',category:'Bread',title:'French Baguette',hydration:70,desc:'Lean dough, crisp shell, creamy open crumb.',yield:'3 baguettes',prep:'20 min',ferment:'4–12 hr',bake:'20–24 min',tempC:250,ingredients:[['Bread flour',500,'g','flour'],['Water',350,'ml','water'],['Instant yeast',2,'g','yeast'],['Salt',10,'g','salt']],steps:['Mix flour, water and yeast. Rest 20 min.','Add salt and knead briefly.','Bulk ferment 2–3 hr, or refrigerate overnight after 60 min.','Divide, pre-shape, rest 20 min, then shape baguettes.','Proof 40–50 min, score, and bake with steam.']},
{id:'sandwich',category:'Bread',title:'Soft Sandwich Bread',hydration:63,desc:'Tender enriched loaf for toast and sandwiches.',yield:'1 large loaf',prep:'20 min',ferment:'2½–3 hr',bake:'30–35 min',tempC:200,ingredients:[['Bread flour',500,'g','flour'],['Milk',315,'ml','water'],['Instant yeast',6,'g','yeast'],['Salt',9,'g','salt'],['Sugar',30,'g','sugar'],['Butter',40,'g','fat']],steps:['Mix flour, milk and yeast. Rest 10 min.','Add salt, sugar and butter. Knead until smooth.','Bulk ferment 60–90 min.','Shape tightly and proof in loaf tin 45–60 min.','Bake until golden; cool before slicing.']}
];
const LS={recipes:'quickrecipe.recipes.v1',favs:'quickrecipe.favs.v1',unit:'quickrecipe.unit.v1'};
let recipes=load(LS.recipes,seedRecipes),favs=new Set(load(LS.favs,[])),unit=localStorage.getItem(LS.unit)||'metric',selectedId=recipes[1]?.id||recipes[0]?.id||null,scale=1,view='amounts',category='All',onlyFavs=false,editingId=null;
function load(k,f){try{let x=localStorage.getItem(k);return x?JSON.parse(x):structuredClone(f)}catch{return structuredClone(f)}}
function saveAll(){localStorage.setItem(LS.recipes,JSON.stringify(recipes));localStorage.setItem(LS.favs,JSON.stringify([...favs]));localStorage.setItem(LS.unit,unit)}
const fmt=n=>{const r=Math.round(n*100)/100;return Number.isInteger(r)?String(r):r.toFixed(r<10?2:1).replace(/0+$/,'').replace(/\.$/,'')};
const cToF=c=>Math.round(c*9/5+32),gToOz=g=>g*.0352739619,mlToFloz=ml=>ml*.0338140227;
function amountText(v,u){v*=scale;if(unit==='metric')return `${fmt(v)} ${u}`;if(u==='g')return `${fmt(gToOz(v))} oz`;if(u==='ml')return `${fmt(mlToFloz(v))} fl oz`;return `${fmt(v)} ${u}`}
function bakers(r,ing){const flour=r.ingredients.find(x=>x[3]==='flour');return flour?`${fmt(ing[1]/flour[1]*100)}%`:'—'}
function categories(){return ['All',...new Set(recipes.map(r=>r.category||'Other'))]}
function renderChips(){document.getElementById('chips').innerHTML=categories().map(c=>`<button class="chip ${category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()})}
function matches(r,q){q=q.toLowerCase();return !q||r.title.toLowerCase().includes(q)||(r.desc||'').toLowerCase().includes(q)||r.ingredients.some(i=>i[0].toLowerCase().includes(q))}
function renderList(){const q=document.getElementById('search').value.trim();const shown=recipes.filter(r=>(category==='All'||r.category===category)&&(!onlyFavs||favs.has(r.id))&&matches(r,q));if(!shown.some(r=>r.id===selectedId)&&shown[0])selectedId=shown[0].id;document.getElementById('list').innerHTML=shown.map(r=>`<button class="card ${r.id===selectedId?'active':''}" data-id="${r.id}"><div class="card-top"><div><div class="tag">${esc(r.category||'Recipe')}</div><h3>${esc(r.title)}</h3></div><span class="heart ${favs.has(r.id)?'on':''}" data-fav="${r.id}">${favs.has(r.id)?'♥':'♡'}</span></div><div class="desc">${esc(r.desc||'')}</div><div class="stats">${r.hydration?`<span class="stat">${fmt(r.hydration)}% hydration</span>`:''}${r.bake?`<span class="stat">${esc(r.bake)}</span>`:''}</div></button>`).join('')||'<div class="empty">No recipes found.</div>';document.querySelectorAll('.card[data-id]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-fav]'))return;selectedId=b.dataset.id;scale=1;view='amounts';render()});document.querySelectorAll('[data-fav]').forEach(h=>h.onclick=e=>{e.stopPropagation();toggleFav(h.dataset.fav)})}
function renderDetail(){const r=recipes.find(x=>x.id===selectedId);const el=document.getElementById('detail');if(!r){el.innerHTML='<div class="empty" style="margin:22px">Choose or add a recipe.</div>';return}const temp=unit==='metric'?`${r.tempC||0}°C`:`${cToF(r.tempC||0)}°F`;el.innerHTML=`<div class="detail-head"><div class="detail-title-row"><div><div class="tag">${esc(r.category||'Recipe')}${r.hydration?` · ${fmt(r.hydration)}% hydration`:''}</div><h1>${esc(r.title)}</h1><div class="desc">${esc(r.desc||'')}</div></div><div class="detail-actions"><button class="btn" id="detailFav">${favs.has(r.id)?'♥ Saved':'♡ Save'}</button><button class="btn" id="editBtn">Edit</button></div></div><div class="detail-actions" style="justify-content:flex-start;margin-top:16px"><div class="seg">${[.5,1,2,3].map(s=>`<button data-scale="${s}" class="${scale===s?'active':''}">${s===.5?'½':s}×</button>`).join('')}</div>${r.ingredients.some(i=>i[3]==='flour')?`<div class="seg"><button data-view="amounts" class="${view==='amounts'?'active':''}">Amounts</button><button data-view="bakers" class="${view==='bakers'?'active':''}">Baker's %</button></div>`:''}</div></div><div class="detail-body"><section class="pane"><h2>Ingredients</h2>${r.ingredients.map(i=>`<div class="ingredient"><span>${esc(i[0])}</span><span class="amount">${view==='bakers'?bakers(r,i):amountText(Number(i[1]),i[2])}</span></div>`).join('')}</section><section class="pane"><h2>Method</h2><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section></div><div class="meta">${r.prep?`<span class="stat">Prep ${esc(r.prep)}</span>`:''}${r.ferment?`<span class="stat">Rest ${esc(r.ferment)}</span>`:''}${r.bake?`<span class="stat">Bake ${esc(r.bake)}</span>`:''}${r.tempC?`<span class="stat">${temp}</span>`:''}${r.yield?`<span class="stat">${esc(r.yield)}</span>`:''}</div>`;document.querySelectorAll('[data-scale]').forEach(b=>b.onclick=()=>{scale=Number(b.dataset.scale);renderDetail()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;renderDetail()});document.getElementById('detailFav').onclick=()=>toggleFav(r.id);document.getElementById('editBtn').onclick=()=>openModal(r)}
function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);saveAll();render();toast(favs.has(id)?'Saved to favourites':'Removed from favourites')}
function render(){document.getElementById('metricBtn').classList.toggle('active',unit==='metric');document.getElementById('imperialBtn').classList.toggle('active',unit==='imperial');document.getElementById('favFilter').classList.toggle('primary',onlyFavs);renderChips();renderList();renderDetail()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openModal(r=null){editingId=r?.id||null;document.getElementById('modalTitle').textContent=r?'Edit recipe':'Add recipe';document.getElementById('deleteBtn').style.visibility=r?'visible':'hidden';const set=(id,v='')=>document.getElementById(id).value=v;set('fTitle',r?.title);set('fCategory',r?.category||'Bread');set('fDesc',r?.desc);set('fYield',r?.yield);set('fTemp',r?.tempC);set('fPrep',r?.prep);set('fFerment',r?.ferment);set('fBake',r?.bake);set('fHydration',r?.hydration);set('fIngredients',r?.ingredients?.map(i=>i.join(' | ')).join('\n'));set('fSteps',r?.steps?.join('\n'));document.getElementById('modalBackdrop').classList.add('show');setTimeout(()=>document.getElementById('fTitle').focus(),50)}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function parseIngredients(txt){return txt.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{let [name,amount,unitName,role='']=line.split('|').map(x=>x.trim());return [name,Number(amount),unitName||'',role]})}
function saveRecipe(){const title=document.getElementById('fTitle').value.trim(),ingredients=parseIngredients(document.getElementById('fIngredients').value),steps=document.getElementById('fSteps').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!title||!ingredients.length||ingredients.some(i=>!i[0]||!Number.isFinite(i[1]))||!steps.length){toast('Add a name, valid ingredients and method steps');return}const data={id:editingId||`r_${Date.now()}`,title,category:document.getElementById('fCategory').value.trim()||'Other',desc:document.getElementById('fDesc').value.trim(),yield:document.getElementById('fYield').value.trim(),tempC:Number(document.getElementById('fTemp').value)||0,prep:document.getElementById('fPrep').value.trim(),ferment:document.getElementById('fFerment').value.trim(),bake:document.getElementById('fBake').value.trim(),hydration:Number(document.getElementById('fHydration').value)||0,ingredients,steps};if(editingId){recipes=recipes.map(r=>r.id===editingId?data:r)}else recipes.unshift(data);selectedId=data.id;category='All';saveAll();closeModal();render();toast(editingId?'Recipe updated':'Recipe added')}
function deleteRecipe(){if(!editingId)return;recipes=recipes.filter(r=>r.id!==editingId);favs.delete(editingId);selectedId=recipes[0]?.id||null;saveAll();closeModal();render();toast('Recipe deleted')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800)}
document.getElementById('search').oninput=render;document.getElementById('metricBtn').onclick=()=>{unit='metric';saveAll();render()};document.getElementById('imperialBtn').onclick=()=>{unit='imperial';saveAll();render()};document.getElementById('favFilter').onclick=()=>{onlyFavs=!onlyFavs;render()};document.getElementById('addBtn').onclick=()=>openModal();document.getElementById('cancelBtn').onclick=closeModal;document.getElementById('saveBtn').onclick=saveRecipe;document.getElementById('deleteBtn').onclick=deleteRecipe;document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script>
</body>
</html>
